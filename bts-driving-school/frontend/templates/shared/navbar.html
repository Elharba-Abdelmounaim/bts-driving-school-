{% load static %}
<script src="https://cdn.tailwindcss.com"></script>


<nav class="bg-white shadow-lg sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-6 sm:px-6 lg:px-8">
    <div class="flex justify-between h-16 items-center">
      
      <div class="flex items-center">
        <a href="{% url 'dashboard' %}" class="flex items-center space-x-3 space-x-reverse">
          <img src="{% static 'images/logo_lhya.svg' %}" alt="أكاديمية الحياة" class="h-12 max-w-7xl object-contain">
          <span class="text-xl font-bold text-gray-900">مدرسة تعليم السياقة</span>
        </a>
      </div>

     
      <ul class="hidden md:flex items-center space-x-6 space-x-reverse font-medium text-gray-700">
